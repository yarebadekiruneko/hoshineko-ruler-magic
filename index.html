    #loading::after { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(0deg, #141a1e 0%, #141a1eee 16%, #141a1eb3 35%, transparent 75%); pointer-events: none; }
    #loading > * { max-width: min(560px, 100%); justify-self: center; }
    #loading-icon { display: block; margin: 0 auto; border-radius: 50%; box-shadow: 0 2px 14px #000a; }
    #loading h1 { font-weight: 700; font-size: clamp(24px, 4vw, 42px); line-height: 1.12; text-shadow: 0 2px 14px #141a1e; }
    #loading-status { font-weight: 500; }
    #loading progress { display: block; width: min(320px, 75vw); height: 7px; border: 0; border-radius: 20px; overflow: hidden; accent-color: #d9ede9; background: #ffffff26; }
    #loading progress::-webkit-progress-bar { background: #ffffff26; border-radius: 20px; }
    #loading progress::-webkit-progress-value { background: #d9ede9; border-radius: 20px; }
    #loading progress::-moz-progress-bar { background: #d9ede9; border-radius: 20px; }
    #loading button { min-height: 44px; border: 1px solid #d9ede9; border-radius: 10px; background: #141a1e; color: #fff7eb; }
    #loading button:focus-visible { outline: 3px solid #d9ede9; outline-offset: 4px; }
    #loading [hidden] { display: none; }
    @media (max-aspect-ratio: 1/1) { #loading::before { background-size: 100% auto; } #loading::after { background: linear-gradient(180deg, transparent 25%, #141a1e 100%) center top / 100% calc(100vw * 2 / 3) no-repeat; } #loading { place-content: center; padding-top: calc(100vw * 2 / 3); padding-bottom: max(24px, env(safe-area-inset-bottom)); } }
    @media (max-height: 480px) and (min-aspect-ratio: 1/1) { #loading { place-content: center end; padding: 16px 24px; } #loading > * { max-width: 44vw; } #loading h1 { font-size: clamp(20px, 4vw, 30px); } #loading::before { background-size: auto 100%; background-position: left center; } #loading::after { background: linear-gradient(90deg, transparent 0%, #141a1e99 40%, #141a1e 65%); } #loading progress { width: min(260px, 40vw); } }

  <script>

      const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":21813892,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
      const threads = false;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      document.getElementById('game-title').textContent = document.title;
      document.documentElement.lang = 'ja';
      status.textContent = 'よみこみちゅう…';
      retry.textContent = 'もういちど ためす';
      progress.setAttribute('aria-label', 'よみこみの ようす');

          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          // Download completion alone is not engine readiness.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = 'index.js';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
